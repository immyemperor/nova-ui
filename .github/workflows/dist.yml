# Builds the distribution bundles: one .tgz per publishable package, with checksums.
#   push to main / pull request  -> build, test, pack, upload artifact (kept 30 days)
#   push a tag v* (e.g. v0.2.0)   -> the same, then attach the bundles to a GitHub release
#   workflow_dispatch             -> the same, optionally without the Material icon download
name: Distribution bundles

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      include_icons:
        description: 'Download Google Material Symbols and bundle them in @kvui/css'
        type: boolean
        default: true
      publish:
        description: 'Publish to npm (tags always publish; this is for a manual release)'
        type: boolean
        default: false

permissions:
  contents: read   # each job raises only what it needs

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download Material Symbols (font, names, licence)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_icons }}
        # Needs GitHub access. If it fails, the bundles are built without the icon files and the verifier reports them as optional.
        continue-on-error: true
        run: pnpm --filter @kvui/css icons:update

      - name: Generate API docs, Vue wrappers and component snapshots
        run: |
          pnpm docs
          node apps/shared/scripts/snapshot.mjs

      - name: Build every package
        run: pnpm build

      - name: Install Chromium for browser tests
        working-directory: packages/core
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.pw-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npx playwright install --with-deps chromium chromium-headless-shell
          ls -la "$PLAYWRIGHT_BROWSERS_PATH"
          test -n "$(ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-* 2>/dev/null)" || { echo "headless shell NOT installed"; exit 1; }

      - name: Test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          pnpm test
          pnpm check:names
          pnpm docs:check
          pnpm playgrounds:check

      - name: Check each package has its built entry points
        run: node scripts/verify-dist.mjs

      - name: Check every package would ship
        run: node scripts/verify-publishable.mjs

      - name: Pack every publishable package
        env:
          DEST: ${{ github.workspace }}/dist-tarballs
        run: |
          mkdir -p "$DEST"
          for dir in packages/*/; do
            pkg="${dir%/}"
            if [ -f "$pkg/package.json" ] && [ "$(node -p "require('./$pkg/package.json').private === true")" = "false" ]; then
              # Packages with a build folder (Angular: dist/) are packed from it
              from="$pkg"
              [ -f "$pkg/dist/package.json" ] && from="$pkg/dist"
              (cd "$from" && pnpm pack --pack-destination "$DEST")
            fi
          done
          ls -la "$DEST"

      - name: Checksums
        run: |
          cd dist-tarballs
          sha256sum *.tgz | tee SHA256SUMS.txt

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: kvui-dist-${{ github.sha }}
          path: dist-tarballs/
          retention-days: 30
          if-no-files-found: error

