  release:
    name: Attach bundles to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: kvui-dist-${{ github.sha }}
          path: dist-tarballs

      - name: Create the GitHub release with the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-tarballs/* --title "$GITHUB_REF_NAME" --generate-notes
