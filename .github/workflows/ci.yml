name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Diagnose browser install
        working-directory: packages/core
        run: |
          echo "playwright version:"; node -p "require('playwright/package.json').version"
          echo "expected path:"; node -e "console.log(require('playwright').chromium.executablePath())"
          echo "cache contents:"; ls -la ~/.cache/ms-playwright 2>&1 || echo "no ms-playwright cache"
          echo "headless shell present?"; ls -d ~/.cache/ms-playwright/chromium_headless_shell-* 2>&1 || echo "NO headless shell in cache"
      - name: Unit tests (core logic, sanitiser, docs, tailwind, vue)
        run: pnpm -r test
      - name: CSS checks and browser layout tests
        run: |
          pnpm --filter @nova-ui/css test
          pnpm --filter @nova-ui/css exec playwright install --with-deps chromium
          pnpm --filter @nova-ui/css test:browser
      - name: Prop names do not shadow DOM members
        run: pnpm check:names
      - name: Documentation covers every component and every link resolves
        run: pnpm docs:check
      - name: Playgrounds use real components, props and classes
        run: pnpm playgrounds:check
      - name: Playgrounds type-check (Vite, Next.js, React)
        run: pnpm --filter playground-vite exec tsc --noEmit && pnpm --filter playground-react exec tsc --noEmit
      - name: Generated docs, wrappers and agent context are up to date
        run: |
          pnpm docs
          git diff --exit-code packages/core/dist-docs packages/vue/src docs/llms-full.txt
